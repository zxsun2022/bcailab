<svg xmlns="http://www.w3.org/2000/svg" width="960" height="453" viewBox="0 0 960 453" role="img" aria-labelledby="title">
<title id="title">Approving a new medicine</title>
<rect width="960" height="453" rx="24" fill="#FBFAF7"/>
<text x="48" y="55" fill="#18202B" font-family="system-ui, sans-serif" font-size="26" font-weight="700">Approving a new medicine</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/></marker></defs>
<line x1="305" y1="173" x2="355" y2="173" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="605" y1="173" x2="655" y2="173" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="780" y1="231" x2="780" y2="279" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="655" y1="337" x2="605" y2="337" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="355" y1="337" x2="305" y2="337" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="55" y="115" width="250" height="116" rx="14" fill="#FFFFFF" stroke="#BCC6D6" stroke-width="2"/><circle cx="78" cy="140" r="17" fill="#2457D6"/><text x="78" y="146" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">1</text><text x="105" y="146" fill="#18202B" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Laboratory</text><foreignObject x="73" y="163" width="214" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 13px system-ui, sans-serif; color: #3C4655; line-height: 1.35">A candidate compound is tested on cells and tissue outside the body.</div></foreignObject>
<rect x="355" y="115" width="250" height="116" rx="14" fill="#FFFFFF" stroke="#BCC6D6" stroke-width="2"/><circle cx="378" cy="140" r="17" fill="#2457D6"/><text x="378" y="146" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">2</text><text x="405" y="146" fill="#18202B" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Animal study</text><foreignObject x="373" y="163" width="214" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 13px system-ui, sans-serif; color: #3C4655; line-height: 1.35">The compound is tested on animals to check safety and dose.</div></foreignObject>
<rect x="655" y="115" width="250" height="116" rx="14" fill="#FFFFFF" stroke="#BCC6D6" stroke-width="2"/><circle cx="678" cy="140" r="17" fill="#2457D6"/><text x="678" y="146" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">3</text><text x="705" y="146" fill="#18202B" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Small trial</text><foreignObject x="673" y="163" width="214" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 13px system-ui, sans-serif; color: #3C4655; line-height: 1.35">A small group of healthy volunteers receives the compound under supervision.</div></foreignObject>
<rect x="655" y="279" width="250" height="116" rx="14" fill="#FFFFFF" stroke="#BCC6D6" stroke-width="2"/><circle cx="678" cy="304" r="17" fill="#2457D6"/><text x="678" y="310" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">4</text><text x="705" y="310" fill="#18202B" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Large trial</text><foreignObject x="673" y="327" width="214" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 13px system-ui, sans-serif; color: #3C4655; line-height: 1.35">Hundreds of patients receive either the compound or an existing treatment.</div></foreignObject>
<rect x="355" y="279" width="250" height="116" rx="14" fill="#FFFFFF" stroke="#BCC6D6" stroke-width="2"/><circle cx="378" cy="304" r="17" fill="#2457D6"/><text x="378" y="310" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">5</text><text x="405" y="310" fill="#18202B" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Review</text><foreignObject x="373" y="327" width="214" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 13px system-ui, sans-serif; color: #3C4655; line-height: 1.35">A regulator examines the trial evidence and decides whether to approve.</div></foreignObject>
<rect x="55" y="279" width="250" height="116" rx="14" fill="#FFFFFF" stroke="#BCC6D6" stroke-width="2"/><circle cx="78" cy="304" r="17" fill="#2457D6"/><text x="78" y="310" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">6</text><text x="105" y="310" fill="#18202B" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Monitor</text><foreignObject x="73" y="327" width="214" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 13px system-ui, sans-serif; color: #3C4655; line-height: 1.35">Effects are recorded after approval and the licence can be withdrawn.</div></foreignObject>
</svg>
