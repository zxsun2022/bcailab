<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="title">
<title id="title">Oakbourne village</title>
<rect width="960" height="550" rx="24" fill="#FBFAF7"/>
<text x="48" y="55" fill="#18202B" font-family="system-ui, sans-serif" font-size="26" font-weight="700">Oakbourne village</text>
<rect x="35" y="115" width="430" height="395" rx="18" fill="#FFFFFF" stroke="#BCC6D6" stroke-width="2"/><text x="250" y="148" text-anchor="middle" fill="#18202B" font-family="system-ui, sans-serif" font-size="19" font-weight="700">Before</text><rect x="55" y="170" width="185" height="84" rx="12" fill="#F1F2F4" stroke="#B8C0CC"/><text x="67" y="194" fill="#18202B" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Main street</text><foreignObject x="67" y="202" width="160" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 12px system-ui, sans-serif; color: #3C4655; line-height: 1.3">Through road carrying all traffic</div></foreignObject>
<rect x="260" y="170" width="185" height="84" rx="12" fill="#F1F2F4" stroke="#B8C0CC"/><text x="272" y="194" fill="#18202B" font-family="system-ui, sans-serif" font-size="13" font-weight="700">North fields</text><foreignObject x="272" y="202" width="160" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 12px system-ui, sans-serif; color: #3C4655; line-height: 1.3">Farmland</div></foreignObject>
<rect x="55" y="275" width="185" height="84" rx="12" fill="#F1F2F4" stroke="#B8C0CC"/><text x="67" y="299" fill="#18202B" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Village square</text><foreignObject x="67" y="307" width="160" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 12px system-ui, sans-serif; color: #3C4655; line-height: 1.3">Car parking</div></foreignObject>
<rect x="260" y="275" width="185" height="84" rx="12" fill="#F1F2F4" stroke="#B8C0CC"/><text x="272" y="299" fill="#18202B" font-family="system-ui, sans-serif" font-size="13" font-weight="700">School lane</text><foreignObject x="272" y="307" width="160" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 12px system-ui, sans-serif; color: #3C4655; line-height: 1.3">Narrow road with no crossing</div></foreignObject>
<rect x="55" y="380" width="185" height="84" rx="12" fill="#F1F2F4" stroke="#B8C0CC"/><text x="67" y="404" fill="#18202B" font-family="system-ui, sans-serif" font-size="13" font-weight="700">River bridge</text><foreignObject x="67" y="412" width="160" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 12px system-ui, sans-serif; color: #3C4655; line-height: 1.3">Single-lane bridge</div></foreignObject>
<rect x="260" y="380" width="185" height="84" rx="12" fill="#F1F2F4" stroke="#B8C0CC"/><text x="272" y="404" fill="#18202B" font-family="system-ui, sans-serif" font-size="13" font-weight="700">East edge</text><foreignObject x="272" y="412" width="160" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 12px system-ui, sans-serif; color: #3C4655; line-height: 1.3">Petrol station</div></foreignObject>
<rect x="495" y="115" width="430" height="395" rx="18" fill="#FFFFFF" stroke="#BCC6D6" stroke-width="2"/><text x="710" y="148" text-anchor="middle" fill="#18202B" font-family="system-ui, sans-serif" font-size="19" font-weight="700">After</text><rect x="515" y="170" width="185" height="84" rx="12" fill="#E7F3EC" stroke="#72A98B"/><text x="527" y="194" fill="#18202B" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Main street</text><foreignObject x="527" y="202" width="160" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 12px system-ui, sans-serif; color: #3C4655; line-height: 1.3">Local access only, with wider pavements</div></foreignObject>
<rect x="720" y="170" width="185" height="84" rx="12" fill="#E7F3EC" stroke="#72A98B"/><text x="732" y="194" fill="#18202B" font-family="system-ui, sans-serif" font-size="13" font-weight="700">North fields</text><foreignObject x="732" y="202" width="160" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 12px system-ui, sans-serif; color: #3C4655; line-height: 1.3">Bypass road and roundabout</div></foreignObject>
<rect x="515" y="275" width="185" height="84" rx="12" fill="#E7F3EC" stroke="#72A98B"/><text x="527" y="299" fill="#18202B" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Village square</text><foreignObject x="527" y="307" width="160" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 12px system-ui, sans-serif; color: #3C4655; line-height: 1.3">Market space and seating</div></foreignObject>
<rect x="720" y="275" width="185" height="84" rx="12" fill="#E7F3EC" stroke="#72A98B"/><text x="732" y="299" fill="#18202B" font-family="system-ui, sans-serif" font-size="13" font-weight="700">School lane</text><foreignObject x="732" y="307" width="160" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 12px system-ui, sans-serif; color: #3C4655; line-height: 1.3">Crossing and reduced speed limit</div></foreignObject>
<rect x="515" y="380" width="185" height="84" rx="12" fill="#E7F3EC" stroke="#72A98B"/><text x="527" y="404" fill="#18202B" font-family="system-ui, sans-serif" font-size="13" font-weight="700">River bridge</text><foreignObject x="527" y="412" width="160" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 12px system-ui, sans-serif; color: #3C4655; line-height: 1.3">Single-lane bridge retained</div></foreignObject>
<rect x="720" y="380" width="185" height="84" rx="12" fill="#E7F3EC" stroke="#72A98B"/><text x="732" y="404" fill="#18202B" font-family="system-ui, sans-serif" font-size="13" font-weight="700">East edge</text><foreignObject x="732" y="412" width="160" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 12px system-ui, sans-serif; color: #3C4655; line-height: 1.3">Petrol station relocated to the bypass</div></foreignObject>
</svg>
